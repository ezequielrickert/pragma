<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mechanical loop fixture: infinite reveal</title></head>
<body>
  <h1>Infinite reveal (max_passes_per_page give-up regression fixture)</h1>
  <!-- Every click - on the original trigger or on anything it spawns - adds
       one more new button. The interaction frontier never fully drains, no
       matter how many passes are made - the exact "keeps generating
       genuinely new content faster than one pass's budget can keep up with"
       case max_passes_per_page exists to bound. -->
  <div id="container">
    <button id="loadMore" onclick="addMore()">Load more</button>
  </div>
  <script>
    let counter = 0;
    function addMore() {
      counter++;
      const btn = document.createElement('button');
      btn.id = 'more' + counter;
      btn.textContent = 'More ' + counter;
      btn.onclick = addMore;
      document.getElementById('container').appendChild(btn);
    }
  </script>
</body>
</html>
