<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlap Threshold Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --border: #ddd6c8;
    --ink: #2a251c;
    --ink-dim: #6b6455;
    --accent: #8a5a2b;
    --split-bg: #e4efe0;
    --split-fg: #2f5c2a;
    --merge-bg: #f5e3df;
    --merge-fg: #8a3a2b;
    --warn-bg: #fbeecb;
    --warn-border: #cf9d3f;
    --mono-bg: #efeadd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1812;
      --surface: #241f17;
      --border: #3a3325;
      --ink: #ece5d6;
      --ink-dim: #a89d86;
      --accent: #d4a15c;
      --split-bg: #223021;
      --split-fg: #92c98a;
      --merge-bg: #332120;
      --merge-fg: #d98d7c;
      --warn-bg: #3a2f16;
      --warn-border: #a9812f;
      --mono-bg: #2c2619;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1812;
    --surface: #241f17;
    --border: #3a3325;
    --ink: #ece5d6;
    --ink-dim: #a89d86;
    --accent: #d4a15c;
    --split-bg: #223021;
    --split-fg: #92c98a;
    --merge-bg: #332120;
    --merge-fg: #d98d7c;
    --warn-bg: #3a2f16;
    --warn-border: #a9812f;
    --mono-bg: #2c2619;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Source Serif 4", Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    max-width: 860px;
    margin: 2.5rem auto;
    padding: 0 1.25rem 3rem;
    line-height: 1.55;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    text-wrap: balance;
    margin-bottom: .3rem;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .intro { color: var(--ink-dim); max-width: 65ch; }
  code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: var(--mono-bg);
    padding: .05rem .35rem;
    border-radius: 4px;
    font-size: .9em;
  }
  .headline {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--ink);
    padding: .7rem 1rem;
    border-radius: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .85rem;
    margin: 1.25rem 0;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: .6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
  }
  .controls label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; }
  .controls .row { display: flex; align-items: center; gap: .6rem; flex-direction: row; }
  #thresholdVal { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #scenarios { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 1.5rem; }
  .scenario {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
  }
  .scenario h2 { font-size: 1.02rem; margin: 0 0 .25rem; }
  .scenario .note { color: var(--ink-dim); font-size: .88rem; margin: 0 0 .6rem; }
  .cols { display: flex; gap: 1.5rem; overflow-x: auto; }
  .col { flex: 1; min-width: 240px; }
  .col strong { font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); }
  ul { font-size: .82rem; padding-left: 1.1rem; margin: .4rem 0 0; color: var(--ink); }
  li em { color: var(--ink-dim); }
  .verdict {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: .82rem;
    padding: .25rem .6rem;
    border-radius: 6px;
    display: inline-block;
  }
  .split { background: var(--split-bg); color: var(--split-fg); }
  .merge { background: var(--merge-bg); color: var(--merge-fg); }
  .ratio-line { font-family: "IBM Plex Mono", monospace; font-size: .88rem; margin: 0 0 .3rem; }
</style>
</head>
<body>
<div class="eyebrow">Prototype · throwaway · ticket #194</div>
<h1>Tuning <code>state_transition_overlap_threshold</code></h1>
<p class="intro">Reacts to real and synthetic before/after component sets against the actual
<code>component_overlap_ratio</code> logic, so the threshold's real trade-off is visible instead
of argued from first principles.</p>

<div class="headline" id="headline"></div>

<div class="controls">
  <label>Threshold
    <div class="row">
      <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.5">
      <span id="thresholdVal">0.50</span>
    </div>
  </label>
  <label class="row"><input type="checkbox" id="altSignal" style="width:auto;"> also treat a same-set
    <code>selected</code>/<code>aria-pressed</code>-flip as a state change (independent of overlap ratio)</label>
</div>

<div id="scenarios"></div>

<script>
// Faithful port of spiders/content/component_matching.py::component_identity / component_overlap_ratio
function identity(c) { return [c.tag, c.role || '', c.name || '', c.form || '', c.text].join('|'); }
function overlapRatio(before, after) {
  const b = new Set(before.filter(c => c.visible).map(identity));
  if (b.size === 0) return 1.0;
  const a = new Set(after.filter(c => c.visible).map(identity));
  let hit = 0;
  b.forEach(id => { if (a.has(id)) hit++; });
  return hit / b.size;
}

// --- Scenario A: REAL capture from data/sites/mapadeprofesionales.com.lbdb ---
// Page mapadeprofesionales.com -> #state:576ad8e33c. The *only* state
// transition this site's one crawl actually produced.
const realBefore = [
  ['a','','','','EspacioTDAH Logo',true],['button','','','','Menú',true],
  ['button','','','','Filtrar por verificados',true],['button','','','','Filtrar por verificados',true],
  ['a','','','','Información sobre la búsqueda',true],['button','combobox','','','Ej: Argentina',true],
  ['input','','','','Código postal',true],['button','','','','Buscar',true],
  ['button','','','','Virtual',true],['button','','','','Buscar obra social...',true],
  ['button','','','','Psicología',true],['button','','','','Psiquiatría',true],
  ['button','','','','Psicopedagogía',true],['button','','','','Neurología',true],
  ['button','','','','Coaching',true],['button','','','','T. ocupacional',true],
  ['button','','','','Otros',true],['input','','','','Buscar profesionales y farmacias',true],
  ['button','','','','Mapa',false],['button','','','','Anterior',true],
  ['button','','','','',false],['button','','','','',false],
  ['a','','','','@espaciotdah',false],['a','','','','espaciotdah.com',false],
  ['button','','','','Presencial',true],['button','','','','Ir al mapa',true],
  ['div','button','','','Presencial\n\nDra. Ángeles Menendez\n\nOtros\nBuenos Aires, Argentina',true],
  ['button','','','','Conectar',true],
  ['div','button','','','Presencial\n\nCentro de integración escolar\n\nOtros\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\n\nDra Varinia A. Frau Alveal\n\nPsiquiatría\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\n\nDr. Nicolás Schnitzler\n\nPsiquiatría\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\nVirtual\n\nDr. Guido Norberto Luppi\n\nOtros\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\n\nLic. Patricia Simao\n\nPsicología\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\n\nDr. Guillermo Bernaldo de Quiros\n\nPsiquiatría\nBuenos Aires, Argentina',true],
  ['div','button','','','Presencial\n\nInes Christie Newbery\n\nPsicopedagogía\nBuenos Aires, Argentina',true],
  ['button','','','','Siguiente',true],['button','','','','Subir',true],
  ['button','','','','Restablecer filtros',true],['div','option','','','Alemania',true],
  ['button','','','','Limpiar',true],['button','','','','Limpiar búsqueda',true],
].map(r => ({tag:r[0],role:r[1],name:r[2],form:r[3],text:r[4],visible:r[5]}));
const realAfter = [
  ['a','','','','Volver al inicio',true],['button','','','','Recargar página',true],
].map(r => ({tag:r[0],role:r[1],name:r[2],form:r[3],text:r[4],visible:r[5]}));

// --- Scenario B: SYNTHETIC — the "list/map toggle" the ticket names.
// Built from the same site's real component vocabulary. Nav/filter chrome
// (search, category pills, pagination) survives the toggle untouched; the
// result cards + their "Conectar" button do not (a map view renders
// markers, not the same DOM). overlap_ratio = 0.71 here — above the
// default 0.5 threshold, so today's default *merges* this, not splits it.
const toggleBefore = [
  ['button','','','','Menú',true],['button','','','','Filtrar por verificados',true],
  ['button','combobox','','','Ej: Argentina',true],['input','','','','Código postal',true],
  ['button','','','','Buscar',true],['button','','','','Virtual',true],
  ['button','','','','Psicología',true],['button','','','','Psiquiatría',true],
  ['button','','','','Anterior',true],['button','','','','Siguiente',true],
  ['button','','','','Subir',true],['button','','','','Restablecer filtros',true],
  ['div','button','','','Dra. Ángeles Menendez',true],['button','','','','Conectar',true],
  ['div','button','','','Centro de integración escolar',true],['button','','','','Conectar',true],
  ['div','button','','','Dra Varinia A. Frau Alveal',true],['button','','','','Conectar',true],
  ['div','button','','','Dr. Nicolás Schnitzler',true],['button','','','','Conectar',true],
].map(r => ({tag:r[0],role:r[1],name:r[2],form:r[3],text:r[4],visible:r[5],selected:false}));
const toggleAfter = [
  ['button','','','','Menú',true],['button','','','','Filtrar por verificados',true],
  ['button','combobox','','','Ej: Argentina',true],['input','','','','Código postal',true],
  ['button','','','','Buscar',true],['button','','','','Virtual',true],
  ['button','','','','Psicología',true],['button','','','','Psiquiatría',true],
  ['button','','','','Anterior',true],['button','','','','Siguiente',true],
  ['button','','','','Subir',true],['button','','','','Restablecer filtros',true],
  ['div','marker','','','Dra. Ángeles Menendez (pin)',true],
  ['div','marker','','','Centro de integración escolar (pin)',true],
  ['a','','','','Leaflet | © OpenStreetMap',true],['button','','','','Zoom +',true],
].map(r => ({tag:r[0],role:r[1],name:r[2],form:r[3],text:r[4],visible:r[5],selected:false}));
// The pair of buttons that actually drive the toggle: same identity before
// and after, only `selected` flips (this is the "alternative signal").
const toggleTrigger = { before: {tag:'button',role:'',name:'',form:'',text:'Mapa',visible:true,selected:false},
                         after:  {tag:'button',role:'',name:'',form:'',text:'Mapa',visible:true,selected:true} };

// --- Scenario C: SYNTHETIC — ordinary DOM churn (lazy ad slot + a
// relative timestamp re-rendering) that should NOT be treated as a new
// screen. overlap_ratio = 0.88 — close enough to Scenario B's 0.71 that
// no single threshold cleanly separates "genuine toggle" from "churn"
// using overlap ratio alone; a threshold picked to catch B (<=0.71) also
// risks catching noisier churn than this one.
const churnBefore = toggleBefore; // same base chrome
const churnAfter = [
  ['button','','','','Menú',true],['button','','','','Filtrar por verificados',true],
  ['button','combobox','','','Ej: Argentina',true],['input','','','','Código postal',true],
  ['button','','','','Buscar',true],['button','','','','Virtual',true],
  ['button','','','','Psicología',true],['button','','','','Psiquiatría',true],
  ['button','','','','Anterior',true],['button','','','','Siguiente',true],
  ['button','','','','Subir',true],['button','','','','Restablecer filtros',true],
  ['div','button','','','Dra. Ángeles Menendez',true],['button','','','','Conectar',true],
  ['div','button','','','Centro de integración escolar',true],['button','','','','Conectar',true],
  ['a','','','','Publicidad — Ver oferta',true], // ad slot swapped in
  ['div','','','','Actualizado hace 2 minutos',true], // timestamp re-render
].map(r => ({tag:r[0],role:r[1],name:r[2],form:r[3],text:r[4],visible:r[5],selected:false}));

const scenarios = [
  { id: 'A', title: 'A — Real capture (mapadeprofesionales.com → #state:576ad8e33c)',
    note: 'The only state transition this site\'s crawl ever produced. It\'s a full-page error/crash boundary, not a toggle: 36 visible components collapse to 2 unrelated ones.',
    before: realBefore, after: realAfter, expectSplit: true, trigger: null },
  { id: 'B', title: 'B — Synthetic: the list/map toggle the ticket names',
    note: 'Nav chrome survives; the 7 result cards don\'t (a map renders markers, not the list DOM). This is the case #188 (Screen writer) needs the crawler to actually split.',
    before: toggleBefore, after: toggleAfter, expectSplit: true, trigger: toggleTrigger },
  { id: 'C', title: 'C — Synthetic: ordinary DOM churn (ad slot + timestamp)',
    note: 'Same chrome, same cards, only an ad slot and a relative timestamp re-render. Should stay a same-page reveal at any sane threshold.',
    before: churnBefore, after: churnAfter, expectSplit: false, trigger: null },
];

function componentList(list, otherList) {
  const otherIds = new Set(otherList.filter(c=>c.visible).map(identity));
  return '<ul>' + list.map(c => {
    const cls = !c.visible ? '' : (otherIds.has(identity(c)) ? '' : (list===otherList ? '' : ''));
    return `<li>${c.tag}${c.role?'['+c.role+']':''} "${(c.text||'').split('\n')[0].slice(0,40)}"${!c.visible?' <em>(hidden)</em>':''}</li>`;
  }).join('') + '</ul>';
}

function render() {
  const threshold = parseFloat(document.getElementById('threshold').value);
  document.getElementById('thresholdVal').textContent = threshold.toFixed(2);
  const altSignal = document.getElementById('altSignal').checked;
  const container = document.getElementById('scenarios');
  container.innerHTML = '';
  let anyDisagree = false;
  scenarios.forEach(s => {
    const ratio = overlapRatio(s.before, s.after);
    let splitByRatio = ratio < threshold;
    let splitByAlt = false;
    if (altSignal && s.trigger) {
      splitByAlt = identity(s.trigger.before) === identity(s.trigger.after) &&
                   s.trigger.before.selected !== s.trigger.after.selected;
    }
    const split = splitByRatio || splitByAlt;
    if (split !== s.expectSplit) anyDisagree = true;
    const div = document.createElement('div');
    div.className = 'scenario';
    div.innerHTML = `
      <h2>${s.title}</h2>
      <p class="note">${s.note}</p>
      <p class="ratio-line">overlap_ratio = <code>${ratio.toFixed(2)}</code> &rarr;
        <span class="verdict ${split ? 'split':'merge'}">
          ${split ? 'transition_to_new_state (split)' : 'handle_same_page_reveal (merge)'}
        </span>
        ${splitByAlt && !splitByRatio ? ' <em>(caught only by the selected/aria-pressed signal)</em>' : ''}
        &mdash; expected: ${s.expectSplit ? 'split' : 'merge'} ${split === s.expectSplit ? '✅' : '⚠️'}
      </p>
      <div class="cols">
        <div class="col"><strong>before (visible, ${s.before.filter(c=>c.visible).length})</strong>${componentList(s.before.filter(c=>c.visible), s.after)}</div>
        <div class="col"><strong>after (visible, ${s.after.filter(c=>c.visible).length})</strong>${componentList(s.after.filter(c=>c.visible), s.before)}</div>
      </div>`;
    container.appendChild(div);
  });
  document.getElementById('headline').textContent = anyDisagree
    ? '⚠️ At this threshold, at least one scenario disagrees with its expected classification — drag the slider.'
    : '✅ All three scenarios classify as expected at this threshold.';
}
document.getElementById('threshold').addEventListener('input', render);
document.getElementById('altSignal').addEventListener('change', render);
render();
</script>
</body>
</html>
