services:
  neo4j:
    image: neo4j:5.24-community
    container_name: pragma-neo4j
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-pragma-local-dev}
    volumes:
      - pragma_neo4j_data:/data
      - pragma_neo4j_logs:/logs

volumes:
  pragma_neo4j_data:
  pragma_neo4j_logs:
