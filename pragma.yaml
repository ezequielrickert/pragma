# Written by `python3 cli.py config`. Edit freely or re-run the wizard.
#
# Seven settings were removed here on 2026-08-14: scraper, generator,
# logs_dir, progress_logs_dir, graph_logs_dir, batch_size and max_iterations.
# None of them were fields on PragmaConfig, so the loader had been dropping
# all seven in silence. max_iterations: 40 was the costly one - it read like a
# 40-page cap and bounded nothing, and the run it was meant to stop went 12
# hours. The loader now names any key it does not recognize on startup.
agent: local
graph_store: duckdb
out_dir: docs
headless: true
wait_seconds: 15.0

# Purga lo que este sitio tenga en el grafo antes de arrancar: el crawl
# empieza de cero. Combinado con crawl_budget de abajo, cada corrida vuelve a
# purgar y nunca pasa de las primeras 20 paginas - para ir de a tandas hay que
# ponerlo en false (o borrar esta linea) despues de la primera corrida.
fresh: true

# How much one run does before stopping and leaving the rest Pending for the
# next one, which resumes from exactly there. Comment the whole block out
# (or pass --full) to crawl until the frontier drains.
crawl_budget:
  pages: 20
  # Worth keeping even though `pages` is the real intent: a page whose DOM
  # keeps producing new components finishes no page at all, so a page-only
  # budget never trips. This is the backstop that still returns the terminal.
  minutes: 90
agents:
  local:
    # Reached through a Tailscale tunnel - requires LOCAL_API_KEY in .env for
    # bearer-token auth (see .env.example); this hostname itself isn't secret.
    base_url: https://local.tailb3c4a4.ts.net/v1/chat/completions
    # model: intentionally left unset here (was "qwen/qwen2.5-coder-7b-instruct").
    # This field wins over .env's LOCAL_MODEL (pragma.yaml > env var precedence -
    # see ARCHITECTURE.md), which silently pinned every run to that model
    # regardless of what LOCAL_MODEL got changed to in .env between the
    # gemma-4 vs. "modelo nuevo" comparison (docs/explicativos/
    # avance-corridas-gemma-empanadapp.md) - both runs actually requested
    # qwen2.5-coder-7b-instruct, which is why that doc couldn't confirm gemma
    # was really being compared. Leaving this unset makes .env's LOCAL_MODEL
    # (src/agents/local_agent.py::LocalConfig - "the single place that knows
    # about LOCAL_MODEL") the one place to change per run - re-set this only
    # if you want pragma.yaml to override .env on purpose again.
    timeout: 1800
    max_tokens: 8192
graph_stores:
  duckdb:
    path: data/pragma.duckdb