<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lists — Graph Explorer — Ladybug Pipeline</title>
  <meta name="description" content="Internal debugging tool — list and detail view for Ladybug graph nodes" />
  <link rel="stylesheet" href="./src/layout/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="lists-topbar" id="lists-tabs">
        <!-- Type tabs rendered by lists-page.js -->
      </div>
      <div class="lists-body">
        <div class="lists-table-area" id="lists-table-area">
          <div class="lists-search-bar" id="lists-search-bar"></div>
          <div id="lists-table-container">
            <!-- Table rendered by lists-page.js -->
          </div>
        </div>
        <div class="drawer" id="lists-drawer">
          <div class="drawer-inner" id="lists-detail"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initShell } from "./src/layout/shell.js";
    import { initListsPage } from "./src/lists/lists-page.js";

    initShell("lists");
    initListsPage();
  </script>
</body>
</html>
