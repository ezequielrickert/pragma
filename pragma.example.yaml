# Pragma pipeline wiring. Normally you don't hand-edit this file - run
# `python3 src/cli.py config` for an interactive wizard that writes it (and
# saves API keys to .env) for you. This file is just a reference/starting
# point, and a place to look if you want to edit a setting by hand.
#
# Copy to pragma.yaml (auto-loaded) or pass --config <path>.
# Any value here can be overridden by a CLI flag.
# url: https://example.com
scraper: playwright  # playwright (in-process) | rest (talks to a standing local API server, run
                      # separately via `python -m src.api_server` - same PlaywrightScraper actions
                      # plus curated docs, persistent browser session decoupled from this process;
                      # see ARCHITECTURE.md's "Module 3: Unified REST API". Base URL via
                      # PRAGMA_API_URL, default http://127.0.0.1:8765)
agent: gemini        # gemini | openai | local | mock
generator: simple
graph_store: memory  # memory | neo4j - "memory" needs nothing running; "neo4j" needs a live instance
                      # (see docker-compose.yml) and persists the navigation graph, queryable
                      # between iterations, isolated per crawled site via a `site` property
fresh: true           # purge this site's previously recorded graph_store state before crawling
                       # (only matters for graph_store: neo4j - memory never persists across runs
                       # regardless). Set false to resume a previous run's progress on a large,
                       # stable site instead of starting over - but leave this on for any site whose
                       # URLs are per-session tokens (e.g. a `/o/<random-id>` order flow), where old
                       # runs' "visited" nodes will never be revisited and just add stale history.
out_dir: docs
logs_dir: research_logs
progress_logs_dir: progress_logs  # append-only per-iteration debug trail, for understanding LLM behavior
graph_logs_dir: graph_logs        # navigation graph (which action led from which page to which page) and
                                   # the per-page component ledger (every component seen, whether it was
                                   # interacted with, and its interaction history), both as JSON
headless: true
max_iterations: 12
wait_seconds: 15  # settle time after navigate/click before reading links; raise for JS-heavy sites
batch_size: 20    # default cap for both pending routes and DNA components per iteration prompt; lower
                  # = faster iterations, more of them needed (raise max_iterations to match) - good
                  # for small/local models
# pending_batch_size: 20    # override just the pending-routes cap; falls back to batch_size if unset
# component_batch_size: 20  # override just the DNA-components cap; falls back to batch_size if unset -
                             # raise this alone for a component-dense page (a mega-nav with hundreds of
                             # elements) without inflating the unrelated pending-routes budget
allow_subdomains: false  # if true, a subdomain (e.g. blog.example.com) counts as in-scope for a crawl
                          # of example.com and its links get queued as pending routes too (naive
                          # last-two-label match, not a full public-suffix-list lookup)
max_stalled_finish_attempts: 3  # give up on a page's remaining unexplored components after this many
                                 # consecutive checks find its debt hasn't shrunk - protects against a
                                 # component whose identity shifts every DOM change (e.g. a quantity
                                 # stepper) or a real interaction whose outcome never changes (e.g. a
                                 # login retried against invalid credentials) burning the whole run on
                                 # one page. Raise it if a real site legitimately needs more attempts
                                 # before "not improving" is really true (e.g. slow-loading filters).
deep_context: true       # read a deeper "what is this site/app for" text from the root page once, at
                          # the start of Discovery, and surface it every iteration - grounds fill
                          # values/actions in the site's real purpose (e.g. never types "lapicera" into
                          # a flavor field on an empanada-ordering site). No extra LLM call. Set false
                          # to skip (e.g. a very slow site, or a root page not representative of the rest).
context_max_chars: 1500  # cap on the extracted site-context text

# Opt-in: mark URL path segments that are per-visit/dynamic rather than a real
# distinct route (e.g. an order confirmation page whose URL embeds a random
# token, like /o/<token>) - a matching segment collapses to a literal `{id}`
# placeholder before the URL becomes a graph-node key, so every visit is
# treated as the same page instead of minting a new node per token. Empty by
# default (no effect) - only add a pattern for a site you've actually seen
# this happen on, matched with re.fullmatch against ONE path segment at a
# time (never the domain). See docs/explicativos/neo4j.md's "Problema
# conocido" section.
# dynamic_url_segments:
#   - '^[A-Za-z0-9]{16,}$'
strip_query_params: true  # drop query strings from the graph-node key by default (most are
                           # tracking/session tokens, not meaningfully different content)
# keep_query_params:       # query param NAMES to keep even when strip_query_params is true,
#   - page                 # for a site where a param genuinely changes content (e.g. ?page=2)

# Optional: non-secret, per-provider settings. Only the block matching `agent`
# above (or --agent on the CLI) is used. Anything you omit here falls back to
# that provider's own environment variables (see .env.example) - so you never
# need to touch this file for providers you're not using, and this file keeps
# growing per-provider instead of piling more prefixed vars into .env.
#
# Keep API keys and credential file paths in .env, not here, since this file
# may be committed to version control.
agents:
  gemini:
    model: models/gemini-1.5-flash-latest
  openai:
    model: gpt-4o-mini
  local:
    base_url: http://localhost:1234/v1/chat/completions
    model: my-local-model
    # timeout: 600      # per-request seconds; raise for a slow/large local model
    # max_tokens: 1024  # cap each response's generated tokens - unset by default,
                         # since a reasoning model (DeepSeek-R1 and similar) needs
                         # room for its chain-of-thought before its actual answer;
                         # only set this once you know your model's real budget

# Optional: non-secret, per-graph-store settings, same shape as `agents:`
# above. Only used when `graph_store: neo4j`. Password stays in .env
# (NEO4J_PASSWORD) - never here.
graph_stores:
  neo4j:
    host: localhost
    port: 7687
    database: neo4j
