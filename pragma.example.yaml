# Pragma pipeline wiring. Normally you don't hand-edit this file - run
# `python3 src/cli.py config` for an interactive wizard that writes it (and
# saves API keys to .env) for you. This file is just a reference/starting
# point, and a place to look if you want to edit a setting by hand.
#
# Copy to pragma.yaml (auto-loaded) or pass --config <path>.
# Any value here can be overridden by a CLI flag.
# url: https://example.com
agent: gemini        # gemini | openai | local | mock
graph_store: memory  # memory | neo4j - "memory" needs nothing running; "neo4j" needs a live instance
                      # (see docker-compose.yml) and is the crawl's live, primary source of truth -
                      # written to as the crawl happens, then read back by GraphPRDSynthesizer
fresh: true           # purge this site's previously recorded graph_store state before crawling
                       # (only matters for graph_store: neo4j - memory never persists across runs
                       # regardless). Set false to resume a previous run's progress on a large,
                       # stable site instead of starting over - but leave this on for any site whose
                       # URLs are per-session tokens (e.g. a `/o/<random-id>` order flow), where old
                       # runs' "visited" nodes will never be revisited and just add stale history.
                       # Resuming rebuilds the frontier from every page the last session left
                       # unfinished; pages it did finish are skipped, not recrawled.

# Stopping a session deliberately, to resume it later with fresh: false. Everything
# already crawled is in the graph store, and everything not yet crawled is still
# Pending there, so a stopped session loses no work - it just leaves the rest queued.
# stop_after_pages: 100    # pages THIS session may visit. Different from max_pages, which bounds
                       # the crawl across every session that resumes it. Soft bound with
                       # page_concurrency > 1, same as max_pages (in-flight pages finish).
# stop_after_seconds: 3600 # wall-clock seconds this session may crawl for. Starts once the crawl
                       # is actually underway, so browser startup doesn't count against it.
stop_after_rate_limit_trips: 3  # consecutive circuit-breaker trips that end the session - the
                       # rate-limit exit. The throttle already backs off and pauses every worker
                       # against a straining target, but never gives up; against a site that has
                       # decided to refuse this crawler, that converges on hitting it very slowly
                       # forever. 0 or null keeps that older back-off-indefinitely behavior.
synthesize_on_partial: false  # run the PRD/component-tree synthesis even when the session stopped
                       # early. Off by default: those passes cost LLM calls, describe a site the
                       # crawl hasn't finished seeing, and get paid again in full on the resume.
                       # See max_visits_per_route_shape below for the matching *within-run* control
                       # for this same kind of site.
out_dir: docs
headless: true         # run without a visible browser window - real, measured speedup; leave this on
                       # unless you specifically need to watch the crawl happen
# wait_seconds: 2.0    # settle time before reading a freshly-*navigated* page - raise for slow/
                       # JS-heavy sites, lower for fast static ones
# interaction_wait_seconds: 2.0  # settle time after a click/fill's own re-discovery - unset falls
                       # back to wait_seconds. Usually safe to set noticeably lower than wait_seconds:
                       # a same-page DOM update settles faster than a full page's first hydration, and
                       # every single interaction pays this cost - it's typically the single largest
                       # fixed cost in a real crawl's wall-clock time (confirmed live: ~145
                       # interactions in one run, ~4s of fixed wait apiece)
element_budget: 200  # max components MechanicalCrawler mechanically interacts with per page per
                      # visit-pass - the backstop against a pathological reveal-chain, not a
                      # normal-case limit (200 is generous enough that ordinary pages never hit it)
# max_pages: 50       # total pages to visit before stopping; unset = unbounded (crawl until the
                       # URL frontier is exhausted)
page_concurrency: 1   # how many pages MechanicalCrawler visits at once. 1 = fully sequential
                       # (original behavior, every guarantee holds exactly). Raise for a real,
                       # large-scale crawl - fixed per-interaction waits overlap across concurrently-
                       # visited pages instead of serializing, which is the only way to get a
                       # many-hundred-page crawl down to minutes rather than hours. Becomes a *soft*
                       # bound on max_pages once raised above 1 (can overshoot by up to this many).
ai_fill_values: true   # ask `agent` for a realistic value per fillable field - a real network+
                       # generation round trip per field. Set false to fall back to a fast
                       # deterministic placeholder instead, for a speed-focused run that doesn't need
                       # realistic fill values in the output (especially worth turning off against a
                       # slow/remote local model).
max_visits_per_route_shape: 1  # backstop for a site that mints a fresh, per-visit-token URL (e.g.
                       # `/o/<random-hash>`) on essentially every visit - each token is a real,
                       # distinct page, but visiting more than this many of the *same-shaped* route
                       # (real slugs untouched - see src/utils/urls.py's route_shape()) just burns a
                       # full interaction pass on what's structurally the same page every time.
                       # Default 1: an ordinary site has no repeated route shapes, so this never
                       # fires; raise it to sample more than one instance on purpose.
allow_subdomains: false  # if true, a subdomain (e.g. blog.example.com) counts as in-scope for a crawl
                          # of example.com and its links get queued too (naive last-two-label match,
                          # not a full public-suffix-list lookup)
# debug_logs_keep_last: 5  # keep only the N most recent debug_logs/ run directories for this site+URL,
                       # deleting older ones once a run finishes. unset = unbounded (keep every run
                       # forever, unchanged default) - opt in once debug_logs/ disk usage becomes a
                       # real concern for a site crawled repeatedly. See src/crawlers/debug_log.py.
export_json: false    # also write docs/{slug}_graph_{timestamp}.json - the full crawl graph (pages,
                       # edges, component ledger, text content) as structured JSON, alongside the
                       # prose PRD and the component tree - for a downstream tool that wants the
                       # crawl's facts as data instead of documents meant for a person to read. See
                       # src/generators/graph_export.py. Every run is always recorded (regardless of
                       # this flag) in docs/runs.json - see src/utils/io.py::record_run_manifest.
# page_timeout_seconds: 15.0  # crawl4ai's raw navigation/goto dead-page timeout - a DIFFERENT phase
                       # than wait_seconds/interaction_wait_seconds above (those apply after a page
                       # has already loaded; this bounds the underlying fetch itself). crawl4ai's own
                       # default is 60s; lower this to drop a genuinely hung/dead request faster. Keep
                       # it comfortably above wait_seconds's own scale, or a slow-but-alive real page
                       # gets killed before it ever finishes rendering.
# interaction_timeout_seconds: 10.0  # a THIRD timeout phase - bounds Playwright's own otherwise-
                       # unbounded-by-default internal waits inside one interaction round-trip (e.g.
                       # crawl4ai's own domcontentloaded wait with no explicit timeout). Unset by
                       # default (Playwright's own 30000ms default stays in effect). Confirmed live on
                       # austral.edu.ar: once a session lands on a page whose domcontentloaded event
                       # never fires (a WAF holding the response open), every subsequent interaction
                       # against that session ate a full 30s before failing - see Crawl4AICrawler's
                       # own interaction_timeout_seconds docstring.
# prefetch: false       # skip crawl4ai's own markdown-generation pipeline entirely - real savings,
                       # since this project never reads that output (all facts come from its own
                       # discovery JS instead). Side effect: debug_logs/*/pages/*.md snapshots come
                       # back empty while this is on - leave false during active debugging, true for
                       # a bulk/production run.
# block_images: false   # abort image/media/font network requests outright - real bandwidth/time
                       # savings (unlike crawl4ai's own exclude_external_images, which only trims
                       # already-downloaded images from output this project doesn't read). A real
                       # behavior change if a site's interactive elements depend on images actually
                       # loading - opt in per-site once confirmed safe.
# suppress_navigation: true
                       # on by default: a click that would take the browser off the page being
                       # worked on is aborted at the network layer instead - the destination is
                       # queued as its own page, and the current page stays rendered so its whole
                       # component frontier drains from one single fetch. Set false to go back to
                       # letting the click navigate, which ends that page's pass early and re-fetches
                       # it later to resume (see docs/dev/crawlers/navigation_suppressor.md for the
                       # coverage tradeoff on POST-only destinations).

# Optional: non-secret, per-provider settings. Only the block matching `agent`
# above (or --agent on the CLI) is used. Anything you omit here falls back to
# that provider's own environment variables (see .env.example) - so you never
# need to touch this file for providers you're not using, and this file keeps
# growing per-provider instead of piling more prefixed vars into .env.
#
# Keep API keys and credential file paths in .env, not here, since this file
# may be committed to version control.
agents:
  gemini:
    model: models/gemini-1.5-flash-latest
  openai:
    model: gpt-4o-mini
  local:
    base_url: http://localhost:1234/v1/chat/completions
    model: my-local-model
    # timeout: 600      # per-request seconds; raise for a slow/large local model
    # max_tokens: 1024  # cap each response's generated tokens - unset by default,
                         # since a reasoning model (DeepSeek-R1 and similar) needs
                         # room for its chain-of-thought before its actual answer;
                         # only set this once you know your model's real budget

# Optional: non-secret, per-graph-store settings, same shape as `agents:`
# above. Only used when `graph_store: neo4j`. Password stays in .env
# (NEO4J_PASSWORD) - never here.
graph_stores:
  neo4j:
    host: localhost
    port: 7687
    database: neo4j
